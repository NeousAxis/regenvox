; Pool PHP du relais des abonnements (web/public/api/ia.php), à poser dans /etc/php/8.5/fpm/pool.d/ia.conf.
; Séparé du pool « www » de la collecte (5 processus) : les longs appels à Anthropic, 6 en parallèle par test,
; ne doivent jamais bloquer la réception des réponses aux consultations.
; request_terminate_timeout couvre l'appel le plus long : 1500 s pour une analyse approfondie (48 000 jetons).
; max_children : 2 tests gratuits simultanés (réglage « simultanes ») et un test d'abonné, 6 appels chacun, avec de la
; marge. Un processus occupe environ 15 Mo (mesuré le 23.11.2026, serveur de 1 Go).
[ia]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm-ia.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 60s
request_terminate_timeout = 1600s
env[REGENVOX_CONFIG] = /etc/regenvox/config.php
